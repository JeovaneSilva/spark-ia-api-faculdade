services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: spark_ia
    ports:
      - "5432:5432"
    volumes:
      - spark_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark_ia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spark_db_data:
